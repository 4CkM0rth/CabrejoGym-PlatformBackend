spring:
  config:
    import: optional:file:.env[.properties]

  datasource:
    url: jdbc:mysql://localhost:3306/ecommerce
    username: root
    password: 2004

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true

  liquibase:
    enabled: true
    change-log: classpath:/db/changelog/db.changelog-master.yaml

app:
  jwt:
    issuer: "platform-ecommerce-api"
    access-token-minutes: 60
    refresh-token-days: 7
    secret-base64: ${JWT_SECRET_BASE64}
