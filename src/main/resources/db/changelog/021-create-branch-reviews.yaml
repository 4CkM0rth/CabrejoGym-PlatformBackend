databaseChangeLog:
  - changeSet:
      id: 021-create-branch-reviews
      author: sebastian
      changes:
        - createTable:
            tableName: branch_reviews
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false

              - column:
                  name: branch_id
                  type: BIGINT
                  constraints:
                    nullable: false

              - column:
                  name: user_id
                  type: BIGINT
                  constraints:
                    nullable: false

              - column:
                  name: rating
                  type: INT
                  constraints:
                    nullable: false

              - column:
                  name: comment
                  type: TEXT

              - column:
                  name: status
                  type: VARCHAR(20)
                  defaultValue: PENDING
                  constraints:
                    nullable: false

              - column:
                  name: created_at
                  type: TIMESTAMP
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false

              - column:
                  name: updated_at
                  type: TIMESTAMP
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false

        - addForeignKeyConstraint:
            baseTableName: branch_reviews
            baseColumnNames: branch_id
            referencedTableName: branches
            referencedColumnNames: id
            constraintName: fk_branch_reviews_branch
            onDelete: CASCADE

        - addForeignKeyConstraint:
            baseTableName: branch_reviews
            baseColumnNames: user_id
            referencedTableName: users
            referencedColumnNames: id
            constraintName: fk_branch_reviews_user
            onDelete: CASCADE

        - createIndex:
            tableName: branch_reviews
            indexName: idx_branch_reviews_branch_id
            columns:
              - column:
                  name: branch_id

        - createIndex:
            tableName: branch_reviews
            indexName: idx_branch_reviews_user_id
            columns:
              - column:
                  name: user_id

        - createIndex:
            tableName: branch_reviews
            indexName: idx_branch_reviews_status
            columns:
              - column:
                  name: status

        - sql:
            sql: |
              ALTER TABLE branch_reviews
              MODIFY updated_at TIMESTAMP NOT NULL
              DEFAULT CURRENT_TIMESTAMP
              ON UPDATE CURRENT_TIMESTAMP;
