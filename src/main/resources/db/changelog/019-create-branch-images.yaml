databaseChangeLog:
  - changeSet:
      id: 019-create-branch-images
      author: sebastian
      changes:
        - createTable:
            tableName: branch_images
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false

              - column:
                  name: branch_id
                  type: BIGINT
                  constraints:
                    nullable: false

              - column:
                  name: url
                  type: VARCHAR(500)
                  constraints:
                    nullable: false

              - column:
                  name: alt_text
                  type: VARCHAR(255)

              - column:
                  name: display_order
                  type: INT
                  defaultValueNumeric: 0

              - column:
                  name: is_primary
                  type: TINYINT(1)
                  defaultValueNumeric: 0
                  constraints:
                    nullable: false

        - addForeignKeyConstraint:
            baseTableName: branch_images
            baseColumnNames: branch_id
            referencedTableName: branches
            referencedColumnNames: id
            constraintName: fk_branch_images_branch
            onDelete: CASCADE

        - createIndex:
            tableName: branch_images
            indexName: idx_branch_images_branch_id
            columns:
              - column:
                  name: branch_id
