databaseChangeLog:
  - changeSet:
      id: 014-create-tags
      author: sebastian
      changes:
        - createTable:
            tableName: tags
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false

              - column:
                  name: name
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
                    unique: true

              - column:
                  name: slug
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
                    unique: true

        - createIndex:
            tableName: tags
            indexName: idx_tags_slug
            columns:
              - column:
                  name: slug
