databaseChangeLog:
  - changeSet:
      id: 015-create-product-tags
      author: sebastian
      changes:
        - createTable:
            tableName: product_tags
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false

              - column:
                  name: product_id
                  type: BIGINT
                  constraints:
                    nullable: false

              - column:
                  name: tag_id
                  type: BIGINT
                  constraints:
                    nullable: false

        - addForeignKeyConstraint:
            baseTableName: product_tags
            baseColumnNames: product_id
            referencedTableName: products
            referencedColumnNames: id
            constraintName: fk_product_tags_product
            onDelete: CASCADE

        - addForeignKeyConstraint:
            baseTableName: product_tags
            baseColumnNames: tag_id
            referencedTableName: tags
            referencedColumnNames: id
            constraintName: fk_product_tags_tag
            onDelete: CASCADE

        - createIndex:
            tableName: product_tags
            indexName: idx_product_tags_product_id
            columns:
              - column:
                  name: product_id

        - createIndex:
            tableName: product_tags
            indexName: idx_product_tags_tag_id
            columns:
              - column:
                  name: tag_id

        - addUniqueConstraint:
            tableName: product_tags
            columnNames: product_id, tag_id
            constraintName: uk_product_tags_product_tag
