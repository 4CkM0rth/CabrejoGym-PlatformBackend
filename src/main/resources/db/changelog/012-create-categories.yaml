databaseChangeLog:
  - changeSet:
      id: 012-create-categories
      author: sebastian
      changes:
        - createTable:
            tableName: categories
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false

              - column:
                  name: name
                  type: VARCHAR(255)
                  constraints:
                    nullable: false

              - column:
                  name: slug
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
                    unique: true

              - column:
                  name: description
                  type: TEXT
                  constraints:
                    nullable: true

              - column:
                  name: parent_id
                  type: BIGINT
                  constraints:
                    nullable: true

              - column:
                  name: display_order
                  type: INT
                  defaultValueNumeric: 0
                  constraints:
                    nullable: false

              - column:
                  name: active
                  type: TINYINT(1)
                  defaultValueNumeric: 1
                  constraints:
                    nullable: false

        - addForeignKeyConstraint:
            baseTableName: categories
            baseColumnNames: parent_id
            referencedTableName: categories
            referencedColumnNames: id
            constraintName: fk_categories_parent
            onDelete: CASCADE

        - addForeignKeyConstraint:
            baseTableName: products
            baseColumnNames: category_id
            referencedTableName: categories
            referencedColumnNames: id
            constraintName: fk_products_category

        - createIndex:
            tableName: categories
            indexName: idx_categories_slug
            columns:
              - column:
                  name: slug

        - createIndex:
            tableName: categories
            indexName: idx_categories_parent_id
            columns:
              - column:
                  name: parent_id

        - createIndex:
            tableName: categories
            indexName: idx_categories_active
            columns:
              - column:
                  name: active
