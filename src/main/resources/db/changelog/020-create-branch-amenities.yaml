databaseChangeLog:
  - changeSet:
      id: 020-create-branch-amenities
      author: sebastian
      changes:
        - createTable:
            tableName: branch_amenities
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false

              - column:
                  name: branch_id
                  type: BIGINT
                  constraints:
                    nullable: false

              - column:
                  name: name
                  type: VARCHAR(100)
                  constraints:
                    nullable: false

              - column:
                  name: description
                  type: VARCHAR(255)

              - column:
                  name: icon_name
                  type: VARCHAR(50)

              - column:
                  name: available
                  type: TINYINT(1)
                  defaultValueNumeric: 1
                  constraints:
                    nullable: false

        - addForeignKeyConstraint:
            baseTableName: branch_amenities
            baseColumnNames: branch_id
            referencedTableName: branches
            referencedColumnNames: id
            constraintName: fk_branch_amenities_branch
            onDelete: CASCADE

        - createIndex:
            tableName: branch_amenities
            indexName: idx_branch_amenities_branch_id
            columns:
              - column:
                  name: branch_id
