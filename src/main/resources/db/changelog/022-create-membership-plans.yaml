databaseChangeLog:
  - changeSet:
      id: 022-create-membership-plans
      author: sebastian
      changes:
        - createTable:
            tableName: membership_plans
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false

              - column:
                  name: branch_id
                  type: BIGINT
                  constraints:
                    nullable: false

              - column:
                  name: name
                  type: VARCHAR(100)
                  constraints:
                    nullable: false

              - column:
                  name: description
                  type: TEXT

              - column:
                  name: price
                  type: DECIMAL(19,2)
                  constraints:
                    nullable: false

              - column:
                  name: duration_months
                  type: INT
                  constraints:
                    nullable: false

              - column:
                  name: is_popular
                  type: TINYINT(1)
                  defaultValueNumeric: 0

              - column:
                  name: active
                  type: TINYINT(1)
                  defaultValueNumeric: 1
                  constraints:
                    nullable: false

              - column:
                  name: display_order
                  type: INT
                  defaultValueNumeric: 0

        - addForeignKeyConstraint:
            baseTableName: membership_plans
            baseColumnNames: branch_id
            referencedTableName: branches
            referencedColumnNames: id
            constraintName: fk_membership_plans_branch
            onDelete: CASCADE

        - createIndex:
            tableName: membership_plans
            indexName: idx_membership_plans_branch_id
            columns:
              - column:
                  name: branch_id

        - createIndex:
            tableName: membership_plans
            indexName: idx_membership_plans_active
            columns:
              - column:
                  name: active
