databaseChangeLog:
  - changeSet:
      id: 016-create-product-variants
      author: sebastian
      changes:
        - createTable:
            tableName: product_variants
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false

              - column:
                  name: product_id
                  type: BIGINT
                  constraints:
                    nullable: false

              - column:
                  name: sku
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
                    unique: true

              - column:
                  name: variant_name
                  type: VARCHAR(255)
                  constraints:
                    nullable: true

              - column:
                  name: flavor
                  type: VARCHAR(100)
                  constraints:
                    nullable: true

              - column:
                  name: size
                  type: VARCHAR(100)
                  constraints:
                    nullable: true

              - column:
                  name: color
                  type: VARCHAR(100)
                  constraints:
                    nullable: true

              - column:
                  name: weight
                  type: VARCHAR(100)
                  constraints:
                    nullable: true

              - column:
                  name: material
                  type: VARCHAR(100)
                  constraints:
                    nullable: true

              - column:
                  name: format
                  type: VARCHAR(100)
                  constraints:
                    nullable: true

              - column:
                  name: price_adjustment
                  type: DECIMAL(19,2)
                  defaultValueNumeric: 0
                  constraints:
                    nullable: true

              - column:
                  name: stock
                  type: INT
                  defaultValueNumeric: 0
                  constraints:
                    nullable: false

              - column:
                  name: active
                  type: TINYINT(1)
                  defaultValueNumeric: 1
                  constraints:
                    nullable: false

        - addForeignKeyConstraint:
            baseTableName: product_variants
            baseColumnNames: product_id
            referencedTableName: products
            referencedColumnNames: id
            constraintName: fk_product_variants_product
            onDelete: CASCADE

        - createIndex:
            tableName: product_variants
            indexName: idx_product_variants_product_id
            columns:
              - column:
                  name: product_id

        - createIndex:
            tableName: product_variants
            indexName: idx_product_variants_sku
            columns:
              - column:
                  name: sku

        - createIndex:
            tableName: product_variants
            indexName: idx_product_variants_active
            columns:
              - column:
                  name: active
