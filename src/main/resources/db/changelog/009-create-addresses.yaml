databaseChangeLog:
  - changeSet:
      id: 009-create-addresses
      author: sebastian
      validCheckSum: ANY
      changes:
        - createTable:
            tableName: addresses
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false

              - column:
                  name: user_id
                  type: BIGINT
                  constraints:
                    nullable: false

              - column:
                  name: type
                  type: VARCHAR(20)
                  constraints:
                    nullable: false

              - column:
                  name: full_name
                  type: VARCHAR(255)
                  constraints:
                    nullable: false

              - column:
                  name: street
                  type: VARCHAR(255)
                  constraints:
                    nullable: false

              - column:
                  name: apartment
                  type: VARCHAR(255)
                  constraints:
                    nullable: true

              - column:
                  name: city
                  type: VARCHAR(255)
                  constraints:
                    nullable: false

              - column:
                  name: state
                  type: VARCHAR(255)
                  constraints:
                    nullable: false

              - column:
                  name: zip_code
                  type: VARCHAR(20)
                  constraints:
                    nullable: false

              - column:
                  name: country
                  type: VARCHAR(255)
                  constraints:
                    nullable: false

              - column:
                  name: phone
                  type: VARCHAR(20)
                  constraints:
                    nullable: false

              - column:
                  name: is_default
                  type: TINYINT(1)
                  defaultValueNumeric: 0
                  constraints:
                    nullable: false

        - addForeignKeyConstraint:
            baseTableName: addresses
            baseColumnNames: user_id
            referencedTableName: users
            referencedColumnNames: id
            constraintName: fk_addresses_user
            onDelete: CASCADE

        - createIndex:
            tableName: addresses
            indexName: idx_addresses_user_id
            columns:
              - column:
                  name: user_id
