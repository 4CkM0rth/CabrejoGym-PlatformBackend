databaseChangeLog:
  - changeSet:
      id: 013-create-brands
      author: sebastian
      changes:
        - createTable:
            tableName: brands
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false

              - column:
                  name: name
                  type: VARCHAR(255)
                  constraints:
                    nullable: false

              - column:
                  name: slug
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
                    unique: true

              - column:
                  name: description
                  type: TEXT
                  constraints:
                    nullable: true

              - column:
                  name: logo_url
                  type: VARCHAR(500)
                  constraints:
                    nullable: true

              - column:
                  name: active
                  type: TINYINT(1)
                  defaultValueNumeric: 1
                  constraints:
                    nullable: false

        - addForeignKeyConstraint:
            baseTableName: products
            baseColumnNames: brand_id
            referencedTableName: brands
            referencedColumnNames: id
            constraintName: fk_products_brand

        - createIndex:
            tableName: brands
            indexName: idx_brands_slug
            columns:
              - column:
                  name: slug

        - createIndex:
            tableName: brands
            indexName: idx_brands_active
            columns:
              - column:
                  name: active
