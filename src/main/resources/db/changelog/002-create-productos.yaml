databaseChangeLog:

  - changeSet:
      id: 002-create-productos
      author: cabrejogym
      changes:

        - createTable:
            tableName: productos
            columns:

              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false

              - column:
                  name: nombre
                  type: VARCHAR(150)
                  constraints:
                    nullable: false

              - column:
                  name: descripcion
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
