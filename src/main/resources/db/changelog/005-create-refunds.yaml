databaseChangeLog:
  - changeSet:
      id: 005-create-refunds
      author: sebastian
      changes:
        - createTable:
            tableName: refunds
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false

              - column:
                  name: order_id
                  type: BIGINT
                  constraints:
                    nullable: false
                    unique: true
                    uniqueConstraintName: uk_refunds_order_id

              - column:
                  name: user_id
                  type: BIGINT
                  constraints:
                    nullable: false

              - column:
                  name: status
                  type: VARCHAR(20)
                  constraints:
                    nullable: false

              - column:
                  name: amount
                  type: DECIMAL(19,2)
                  constraints:
                    nullable: false

              - column:
                  name: reason
                  type: VARCHAR(255)
                  constraints:
                    nullable: false

              - column:
                  name: requested_at
                  type: TIMESTAMP
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false

              - column:
                  name: resolved_at
                  type: TIMESTAMP
                  constraints:
                    nullable: true

              - column:
                  name: admin_note
                  type: VARCHAR(255)
                  constraints:
                    nullable: true

        - addForeignKeyConstraint:
            baseTableName: refunds
            baseColumnNames: order_id
            referencedTableName: orders
            referencedColumnNames: id
            constraintName: fk_refunds_order

        - addForeignKeyConstraint:
            baseTableName: refunds
            baseColumnNames: user_id
            referencedTableName: users
            referencedColumnNames: id
            constraintName: fk_refunds_user

        - createIndex:
            tableName: refunds
            indexName: idx_refunds_user_id
            columns:
              - column:
                  name: user_id
