databaseChangeLog:
  - changeSet:
      id: 017-create-product-images
      author: sebastian
      changes:
        - createTable:
            tableName: product_images
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false

              - column:
                  name: product_id
                  type: BIGINT
                  constraints:
                    nullable: false

              - column:
                  name: url
                  type: VARCHAR(500)
                  constraints:
                    nullable: false

              - column:
                  name: alt_text
                  type: VARCHAR(255)
                  constraints:
                    nullable: true

              - column:
                  name: display_order
                  type: INT
                  defaultValueNumeric: 0
                  constraints:
                    nullable: false

              - column:
                  name: is_primary
                  type: TINYINT(1)
                  defaultValueNumeric: 0
                  constraints:
                    nullable: false

        - addForeignKeyConstraint:
            baseTableName: product_images
            baseColumnNames: product_id
            referencedTableName: products
            referencedColumnNames: id
            constraintName: fk_product_images_product
            onDelete: CASCADE

        - createIndex:
            tableName: product_images
            indexName: idx_product_images_product_id
            columns:
              - column:
                  name: product_id

        - createIndex:
            tableName: product_images
            indexName: idx_product_images_display_order
            columns:
              - column:
                  name: display_order

        - createIndex:
            tableName: product_images
            indexName: idx_product_images_is_primary
            columns:
              - column:
                  name: is_primary
