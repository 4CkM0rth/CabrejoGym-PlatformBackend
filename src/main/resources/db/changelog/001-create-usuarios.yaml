databaseChangeLog:

  - changeSet:
      id: 001-create-usuarios
      author: cabrejogym
      changes:

        - createTable:
            tableName: usuarios
            columns:

              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false

              - column:
                  name: nombre
                  type: VARCHAR(100)
                  constraints:
                    nullable: false

              - column:
                  name: apellido
                  type: VARCHAR(100)
                  constraints:
                    nullable: false

              - column:
                  name: email
                  type: VARCHAR(150)
                  constraints:
                    nullable: false
                    unique: true

              - column:
                  name: fecha_nacimiento
                  type: DATE
