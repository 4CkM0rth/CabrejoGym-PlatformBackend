databaseChangeLog:
  - changeSet:
      id: 024-create-payments
      author: system
      changes:
        - createTable:
            tableName: payments
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              
              - column:
                  name: order_id
                  type: BIGINT
                  constraints:
                    nullable: false
                    foreignKeyName: fk_payments_order
                    references: orders(id)
              
              - column:
                  name: status
                  type: VARCHAR(20)
                  constraints:
                    nullable: false
              
              - column:
                  name: payment_method
                  type: VARCHAR(20)
                  constraints:
                    nullable: false
              
              - column:
                  name: amount
                  type: DECIMAL(19,2)
                  constraints:
                    nullable: false
              
              - column:
                  name: transaction_id
                  type: VARCHAR(255)
                  constraints:
                    unique: true
              
              - column:
                  name: authorization_code
                  type: VARCHAR(255)
              
              - column:
                  name: payment_details
                  type: TEXT
              
              - column:
                  name: created_at
                  type: TIMESTAMP
                  constraints:
                    nullable: false
              
              - column:
                  name: updated_at
                  type: TIMESTAMP
                  constraints:
                    nullable: false
        
        - createIndex:
            indexName: idx_payments_order_id
            tableName: payments
            columns:
              - column:
                  name: order_id
        
        - createIndex:
            indexName: idx_payments_status
            tableName: payments
            columns:
              - column:
                  name: status
        
        - createIndex:
            indexName: idx_payments_transaction_id
            tableName: payments
            columns:
              - column:
                  name: transaction_id
